name: Deploy Docker a Elastic Beanstalk
on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Bajar el código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configurar Java 25 (Igual que en tu Dockerfile)
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Compilar con Maven (Saltando los tests para ir rápido)
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 4. Iniciar sesión en el registro de GitHub
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Calcular nombre de la imagen (en minúsculas)
      - name: Lowercase Image Name
        run: |
          echo "IMAGE_NAME=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # 6. Construir y subir la imagen Docker
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.run_number }}

      # 7. Generar archivo docker-compose.yml (CORREGIDO SEGÚN EL FORO)
      # Aquí es donde inyectamos las variables de entorno de AWS al contenedor
      - name: Generate docker-compose.yml
        run: |
          echo "services:
            app:
              image: ${{ env.IMAGE_NAME }}:${{ github.run_number }}
              ports:
                - '80:8080'
              environment:
                - SPRING_DATASOURCE_URL
                - SPRING_DATASOURCE_USERNAME
                - SPRING_DATASOURCE_PASSWORD
              restart: always" > docker-compose.yml

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }}
          region: us-east-1
          application_name: HogwartsAPI
          environment_name: HogwartsAPI-env
          version_label: "hogwarts-v-${{ github.run_number }}"
          deployment_package: docker-compose.yml